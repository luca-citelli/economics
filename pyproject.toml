[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "economic-sim"
version = "0.7.0"
description = "Simulatore economico locale con mercati reali, finanza, investimenti e crisi"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2.2,<2.3", "pydantic>=2.11,<2.12", "PyYAML>=6.0,<6.1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=14,<15"]

[project.scripts]
economic-sim = "economic_sim.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/economic_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
