schema_version: 1
products_file: products.yaml
simulation:
  seed: 42
  step_unit: week
  weeks_per_year: 52
  initial_population: 1000
  initial_banks: 3
  companies_per_product: 3
  country_count: 1
  government_count: 1
  central_bank_count: 1
  currency: UM
runtime:
  start_paused: true
  speed_presets: [0.5, 1.0, 2.0, 5.0, 10.0]
  default_steps_per_second: 1.0
  max_ui_updates_per_second: 5.0
  pause_on_all_clients_disconnected: true
features:
  demographics: false
  company_entry: false
  primary_equity_market: true
  secondary_securities_markets: false
  monetary_regime: fiat
execution:
  profile: initialization_only
  phases:
    financial_service: false
    treasury: false
    planning_credit: false
    labor_wages: false
    extraction: false
    resources: false
    production: false
    final_goods: false
    investment: false
    operating_close: false
    crisis: false
    distributions: false
central_bank:
  reserve_rate: 0.02
  policy_rate: 0.03
  emergency_rate: 0.05
  emergency_lending_enabled: true
  primary_bond_purchases_enabled: true
  weekly_bond_purchase_budget: '0'
  bond_max_price: '1'
government:
  labor_income_tax_rate: 0.20
  profit_tax_rate: 0.25
  bond_maturity_weeks: 52
  fiscal_policy_mode: fixed_nominal_budget
  initial_treasury_per_person: '100'
  weekly_budget_per_person: '5'
  spending_weights: {food: 0.5, household_energy: 0.3, mobility: 0.2}
  initial_bond_reference_price: '1'
  max_bond_yield: 0.25
banks:
  min_equity_ratio: 0.08
  deposit_rate_pass_through: 0.5
  initial_equity_per_person: '150'
  resolution_mode: deposit_conversion
  deposit_insurance_enabled: false
people:
  initial_deposit: '1000'
  deposit_spread: 0.25
  adult_age_min_years: 18
  adult_age_max_years: 65
  reservation_wage: '100'
  wage_spread: 0.20
  propensity_min: 0.1
  propensity_max: 0.9
  liquidity_buffer_weeks: 2.0
  wealth_drawdown_rate: 0.05
opening:
  reference_population: 1000
  reference_companies_per_product: 3
  firm_deposit: '10000'
  offered_wage: '120'
  shares_per_issuer: '1000'
  initial_reputation: 0.5
